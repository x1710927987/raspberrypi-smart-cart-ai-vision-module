runtime:
  target_fps_min: 10.0
  safety_brake_on_lost_ms: 300
  mock_mode: true

perception:
  camera_backend: "picamera2"
  camera_index: 0
  camera_width: 640
  camera_height: 480
  camera_fps:
  camera_warmup_seconds: 1.0
  camera_read_timeout_seconds: 2.0
  camera_stop_timeout_seconds: 2.0
  pixel_format: "RGB888"
  camera_color_order: "bgr"
  device: "cpu"

control:
  serial_port: "/dev/ttyUSB0"
  baud_rate: 115200

serial:
  port: "/dev/ttyUSB0"
  baud: 115200

logging:
  level: "DEBUG"
  log_dir: "logs"
