runtime:
  target_fps_min: 10.0
  safety_brake_on_lost_ms: 300
  mock_mode: true   # 改为 false 以使用真实模块

perception:
  camera_index: 0
  model_path: "models/yolov8-tiny.pt"

control:
  serial_port: "/dev/ttyUSB0"
  baud_rate: 115200

serial:    # 如果你的 SerialCommunicator 需要额外参数，可放在这里
  port: "/dev/ttyUSB0"
  baud: 115200

logging:
  level: "DEBUG"
  log_dir: "logs"